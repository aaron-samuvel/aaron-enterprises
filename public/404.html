<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Aaron Enterprises — Redirecting…</title>
    <script>
      /* GitHub Pages SPA fallback: carry the intended path into the app
         via sessionStorage, then load the SPA root. routing.ts restores it. */
      (function () {
        try {
          var base = '/aaron-enterprises/';
          var rest = location.pathname;
          if (rest.indexOf(base) === 0) rest = rest.slice(base.length);
          else if (rest.indexOf('/') === 0) rest = rest.slice(1);
          if (location.search) rest += location.search;
          if (location.hash) rest += location.hash;
          sessionStorage.setItem('ae-spa-redirect', rest || '/');
        } catch (e) {}
        location.replace('/aaron-enterprises/');
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=/aaron-enterprises/" /></noscript>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8F9FA;font-family:'DM Sans',system-ui,sans-serif;color:#202328}
      .card{text-align:center;padding:32px}
      b{display:block;font-size:15px;letter-spacing:.06em;margin-bottom:10px}
      p{color:#59636E;font-size:13px;margin:0 0 18px}
      a{display:inline-block;padding:10px 22px;border-radius:8px;background:#202328;color:#fff;text-decoration:none;font-size:13px;font-weight:600}
    </style>
  </head>
  <body>
    <main class="card">
      <b>AARON ENTERPRISES</b>
      <p>Taking you into the site…</p>
      <a href="/aaron-enterprises/">Continue manually</a>
    </main>
  </body>
</html>
