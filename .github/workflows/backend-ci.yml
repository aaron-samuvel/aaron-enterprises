name: Spring Boot API CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend and PostgreSQL integration tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify -Pintegration-tests
      - name: Build production container image
        run: docker build --tag aaron-enterprises-api:ci backend
